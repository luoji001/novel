# 视频分镜（画面驱动短篇）—— 写出来直接拿去拆分镜、喂文生视频
#
# ⚠ 下面 [targets] 的数字是**未经标定的起点**，不是实测值。
# bianlun.toml 的数字来自《天幕红尘》51 章的单章分布（p3 定硬线），这个档位没有
# 对应的参照语料。所以硬线只抓真塌缩。
# 正确做法是 `--gate observe` 跑 2~3 部，从 logs/quality.jsonl 取各指标的单章 p3，
# 再回来改这里。详见 README「闸门模式：第一次必须用 observe」。
#
# ── 这个档位和别的小说档位差在哪 ──
# 它**不约束题材**（现实、悬疑、温情、轻科幻都行，具体性由 --genre 的种子行给），
# 约束的是**每一段能不能变成一个镜头**。文生视频和分镜工具只吃得下看得见的东西：
#   ① 心理活动拍不出来。「他意识到」「她心里一沉」到了视频那一步只能删掉或改旁白，
#      所以 interiority 是这个档位最该报警的一项，硬线取全项目唯一标定过的那一档。
#   ② 人和地点越少越好。AI 视频最难的是同一个角色、同一个场景前后长得一样 ——
#      所以人物压到 2~3 个、每人一个全篇不变的外观标识，地点压到 3~4 处来回用。
#   ③ 一章 = 一场戏 = 一个地点 + 一段连续时间。这样 outline.json 的每一章、
#      scene_specs.json 每一场的 place / present，可以直接当分镜表的场次与在场人用。
#   ④ 对白要短，能直接当字幕。
#
# ⚠ **现有指标量不到「拍不拍得出来」本身。** 能量到的只有三个侧面：心理活动段
# （INNER 正则）、叙述段占比、对话 run。比喻堆砌、镜头之间跳轴、角色外观前后
# 对不上，一条都测不到 —— 和 aiyuce 的「空话测不到」、shuangwen 的「设定一致性
# 测不到」是同一类缺口，产出仍然要人看。
name = "视频分镜"
prose_model_hint = "每一段是一个镜头：只写拍得到的动作、物件、光和声音，想法写成动作"

# 对基座 PROSE_SYSTEM_BASE 的**追加**，不是替换 —— 基座那几条
#（「把想法写成他做的事和说的话」、朴素归属、插叙打断对白、弯引号）
# 本来就是画面化的要求，全部成立。
#
# 刻意**不举动作的例子**（「转身走到窗边」之类）：xiaoyuan 的实测是 8B 会把
# 正向例子直接当答案抄走（举了 6 个物件，产出的前 6 名就是那 6 个）。
# 正文层抄例句的后果更糟 —— 同一句跨章出现，直接撞 sent_dup 闸门。
# 只点名禁「仿佛」「似乎」两个词：它们在 metrics.INNER 里，写进叙述段会让
# 那一段被算成心理活动；而且它们本来就是画面上拍不出来的「猜测」。
prose_system_extra = """\
这篇小说要直接拿去生成视频，每一段会变成一个镜头。\
每一段只写镜头拍得到、话筒录得到的东西：人做了什么动作、脸上什么表情、手里拿着什么、\
四周的光线、颜色和声音。一段只写一个画面，不超过三句，写完就换段。\
人心里的想法，写成那一刻他手上、脚下、脸上做出的一个动作。\
写确定看得见的东西，不用「仿佛」「似乎」去比喻或猜测。\
只写此刻正在发生的事，前因交给画面里的物件和人说出口的话。\
如果本场是本章第 1 场，第一段先交代时间、地点和光线，让观众一眼看清人在哪。\
人物的衣着和随身物按设定写，前后一致。对白要短，一句一般不超过二十个字，能直接当字幕。"""

# 文体仍是小说（书名、标题、摘要、审校的口径都不动），只换结构编辑的身份：
# 立意 / 人物 / 大纲 / 分场四次结构化调用都要知道「之后要逐段拍成视频」，
# 否则它会按小说的习惯给出内心戏和每章一个新地方。
[diction]
editor = "中文短篇小说的结构编辑，这篇小说之后要逐段拍成视频"

[meta]
# 9000 字 / 6 章：一章一场戏，整篇拍出来是一条几分钟到十几分钟的短片。
# 这个数**没有语料依据**，是按「一个处境 3~4 处景能讲完」估的，等 observe 跑完再调。
target_total_chars = 9000
chapters = 6
scenes_per_chapter = 3

[rhythm]
# 算出来的章长：首章 1087 字（2 场 × 543），其余 1582 字（3 场 × 527）。
# 单场落在 500 出头 —— README echo 表里那个 400~599 的桶，但那张表是窗口写死 400 字
# 时测的；现在衔接窗口按场长封在三分之一（write.write_scene_candidate），
# 这个桶已经不再是 tail/scene≈1.00 的危险区。
short = 1100
normal = 1600
long = 2000
# 首章走 short：定场章，交代人和地方，对话少是对的，豁免密度硬线合理。
# **末章刻意不走 short**，和大多数小说档位相反：short 档会豁免心理活动硬线
#（metrics.DENSITY_KEYS），而小说式的收尾恰恰就是「他终于明白了……」那一段 ——
# 在这个档位里那是最后一个镜头拍不出来，豁免它等于把闸门关在最该开的地方。
open_scale = "short"
close_scale = "normal"

[scene]
driver_name = "画面"
driver_desc = "这一场观众亲眼看见的那个变化：谁做了哪个动作、哪样东西换了位置或状态"
# 按场次分派职责，而不是给一个句式模板 —— shuangwen 的实测（2026-10-22）：
# 模板的槽位全是章级常量时，章内 N 场会产出 N 份一字不差的 driver（重合 1.00）。
# 这里三类落点（定场画面 / 物件状态 / 改变处境的动作）是三类不同的东西，写不成同一句。
driver_rule = """· 每一场的 driver **只写这一场拍得下来的那个落点**，一句话、不超过 25 字。
  心里的变化不算 driver —— 「他意识到」「她下定决心」拍不出来，
  要写成那个决定落下来时手上做的动作。
· 本章 {want} 场各有不同的职责：
  - 第 1 场是定场：driver 写观众第一眼就能看懂处境的那个画面。
  - 最后一场：driver 写让本章处境改变的那一个动作。
  - 中间各场：driver 写「{obj}」在这一场被谁、怎样改变了状态。
· 「{obj}」在每一场里的状态都要和上一场不同 —— 位置、在谁手里、完好与否，
  观众要能从画面上看出它变了。
"""
axis_name = "可见冲突"
axis_desc = """可见冲突：两个人各想要什么，冲突落在哪样看得见的东西或哪个地方上
（谁拿着它、谁想要它、谁守着那个地方）"""
stance_desc = "他想拿到或守住什么；他会用哪个动作去拿、去守"
premise_rule = """· 这篇要改编成视频，立意必须**拍得出来**：冲突落在看得见的人、东西和地点上，
  不靠旁白或内心独白就能讲清楚。
· logline 写明：谁、在哪个地方、为了哪样东西、和谁起了冲突。
· setting 写年代、具体地点与时段，并且把全篇用到的地点限定在 3~4 处 ——
  后面各章在这几处之间来回，不要每章换一个新地方。
· concrete_objects 必须是画面里一眼认得出的东西：有形状、有颜色、能拿在手上。
  名声、关系、机会这类抽象的东西不算物件。
· ending_direction 写最后一个镜头：谁、在哪、手里拿着什么、做了什么动作。
"""
# 外观标识只约束**类别**、不给实例 —— 同 premise_rule 的理由（xiaoyuan 的教训）。
# 它写在 concrete 里，会经 context.render_anchor 的「手上有：…」进每一场的正文 prompt，
# 这是本项目里唯一能把「角色长相前后一致」带到正文层的通道。
cast_rule = """· 人越少越好：A、B 两个，确有必要再加一个 C。人少，视频里的角色才容易前后一致。
· 每个人的 concrete 除了他手上有什么，还要写一个**全篇不变的外观标识**：
  衣着的颜色与款式、一样从不离身的随身物、或者一处一眼认得出的特征。各人不要重样。
· stance 写成他会做的动作，不写性格形容词。
· ORG 填机构名，LOC 填全篇最主要的那个地点，要具体到能搭出来的景。
"""
outline_rule = """· 每章是一场连续的戏：只发生在**一个地点、一段不间断的时间**里。
  要换地点或跳时间，就开下一章。
· beat 用「时段，地点：发生的事」的写法开头，本章每一场都在这个地点、这个时段里。
· 各章的地点在立意定下的那几处之间轮换，可以回到去过的地方。
· beat 只写**此刻、在这个地点**发生的、观众看得见的事，用动作写。
  过去发生的事不演 —— 只让它留下的一样东西出现在画面里，由人拿起来、递出去、说出口。
· 第一章开头就要让观众看懂：谁、在哪、想要什么。
· 最后一章落在一个具体的画面上，不写总结和感悟。
"""
# 上面「过去的事不演」那条是正向写的，有实测原因（2026-10-27，shipin-check-01）：
# 第一版只写了「『他明白了』『她下定决心』拍不出来」这类反例，6 章大纲里仍有 2 章的
# beat 是「回忆起丈夫的最后时光」「想起自己曾丢失过……」—— 换个说法就绕过去了，
# 和 8B 不照办负向清单是同一条教训。改成「只写此刻此地 + 过去只能化成一样东西」
# 之后**还没有重跑验过**。
# driver 都是「某人对某物做了什么」的动作句，人名和物件名在各场反复出现，
# 措辞天然比 default 的「推进点」接近。同 xuanyi 放到 0.60。
dedup_threshold = 0.60
min_speakers = 1            # 允许单人场：一个人守着、找着、等着，在视频里是常见的戏
require_object = true       # 物件是画面里的锚点，也是镜头之间的连续性

[gates]
min_ratio = 0.55
sim_threshold = 0.90
theme_max = 0.70            # 同一批人、同一批物件、在 3~4 处景之间来回，章间 bigram 重合天然高
title_sim_max = 0.60
plot_sim_max = 0.62
tpl_per_kilo = 16.0
tpl_single_max = 2
sent_dup_min_len = 10
sent_dup_max = 2
sent_self_dup_max = 0
degrade_after = 3

# 视频不需要对白撑场：一整章没人说话的戏是合法的。所以下限压到 5、不设硬线。
# 上侧才是这个档位的塌缩方向 —— 整章对白乒乓，镜头里只有两张说话的脸。
# 但 metrics.structural_reasons 对这一项只支持「低于则拦」，上侧只能是软警告。
[targets.dialogue_chars_pct]
lo = 5.0
hi = 45.0

# **这个档位最要紧的一条。** 区间沿用 metrics.TARGETS 的论辩体口径（hi 6 ≈ 参照书
# 单章 p90 6.7），硬线 15 与 bianlun 相同 —— 那是全项目唯一按单章 p3 标定过的数，
# 也是所有小说档位里最严的。视频对心理活动的容忍只会比论辩体更低，不会更高。
# 两个提醒：
#   · INNER 正则里有「仿佛」「似乎」「想」，比喻句和「想要」也会把一段算成心理活动。
#     prose_system_extra 已点名禁前两个；observe 时先看命中的是哪个词再决定动谁。
#   · 如果 observe 下大部分章都过线，先怀疑正文模型而不是阈值：novel-sft3 是小说 LoRA，
#     带着小说的内心戏先验。可以试 NOVEL_PROSE_MODEL=qwen3-8b（基座）对照一部。
[targets.interiority_para_pct]
lo = 0.0
hi = 6.0
hard = 15.0

# 叙述段（动作、环境、物件）是镜头的本体。低于 35% 说明这一章主要靠对白在走。
# 没有 hard —— 这一侧的硬线方向是「高于则拦」（metrics.structural_reasons），对这里正好反了。
# ⚠ README「实测记录」里 8B 在对话体档位的 narration_para_pct 只有 0~4.9，而且
# prompt 挪不动。shuangwen 因此把下限降到 5；**这里不要照做**：那个档位的本体是对白，
# 这个档位的本体是画面。如果 observe 显示它长期亮着，该治的是结构（比如把叙述节拍
# 做成 SceneSpec 的必填字段），不是把下限调到不响。
[targets.narration_para_pct]
lo = 35.0
hi = 90.0

[targets.attr_adv_pct]
lo = 0.0
hi = 10.0
hard = 18.0

# 下限 0：没有对白的章 run 就是 0，那是合法的默片段落，不该扣分。
# 上限 4：连续四段以上的对白中间没插一个镜头，画面上就只剩两张说话的脸。
# 8B 在对话体档位的天然 run 是 12~21（README「实测记录」），所以这一项大概率会响 ——
# 它和 narration_para_pct 互为印证。不设硬线：上侧没有硬线方向。
[targets.dialogue_run_mean]
lo = 0.0
hi = 4.0
