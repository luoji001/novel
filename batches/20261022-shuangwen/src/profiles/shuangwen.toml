# 爽文（打脸流）
#
# ⚠ 下面 [targets] 的数字是**未经标定的起点**，不是实测值。
# bianlun.toml 的数字来自《天幕红尘》51 章的单章分布（p3 定硬线），这个档位没有
# 对应的参照语料。所以硬线全部放得很松，只抓真塌缩。
# 正确做法是 `--gate observe` 跑 2~3 部，从 logs/quality.jsonl 取各指标的单章 p3，
# 再回来改这里。详见 README「闸门模式：第一次必须用 observe」。
# 想标定的话：往 profiles-sft/shuangwen/ 丢语料，跑 `novel-agent baseline shuangwen`。
#
# ── 张力来源，这是本档位存在的理由 ──
# 和另外六个小说档位都不同，而且不同在**张力的归零方式**上：
#   bianlun  张力 = 两种主张各自站得住，不归零（争完还是两种主张）
#   xuanyi   张力 = 读者与侦探的信息差，靠揭破归零
#   yanqing  张力 = 两人各自站得住的需求不兼容，靠取舍归零
#   shuangwen 张力 = 一方凭一个**真实有效**的凭据压另一方，
#                    靠那个凭据**当场作废**归零 —— 而且必须有人看见
# 三个派生要求，都写进了下面的 rule：
#   ① 压制要先成立。对方真能签那个字、真能让人走人 —— 纸老虎被打倒不构成爽点，
#      这是这个档位最常见的塌缩形态，也是唯一可以在计划层拦住的那个。
#   ② 作废要当场、要靠一个具体动作或具体物完成，不能靠旁白宣布。
#   ③ 要有见证人。爽点的承载者是在场者的反应，不是主角的心情。
#
# ⚠ **设定层刻意放宽到「能被指认」，代价要知道。** 这个档位同时收都市与玄幻
# （凭据可以是签字权、一笔尾款，也可以是宗门身份、一枚令牌）。代价是本项目
# **没有任何设定一致性机制** —— kehuan 档位的「设定代价」也只是 prompt 约束，
# 而现有指标一条都测不到「第三章的境界划分和第七章对不上」。
# 跑玄幻种子时这件事只能靠人看，和 aiyuce 的「空话测不到」是同一类缺口。
name = "爽文"
prose_model_hint = "压制要真的成立，作废要当场完成；反应写具体的人，不写集体名词"

# 对基座 PROSE_SYSTEM_BASE 的**追加**，不是替换 —— 爽文是对话体小说，
# 基座那几条（弯引号、朴素归属、每三到五轮插一段叙述）全部成立。
# 这里做的是把基座那句「插一段动作或环境」**改向**：爽文该插的是在场者的反应。
#
# 四条都对着可预期的失败模式，而且主体写成正向要求 —— 8B 不照办负向清单
# （见 nodes/plan.py 的模块注释），所以只点名禁一个最密的套路，不列禁区表。
prose_system_extra = """\
这是爽文。先把压制写成立：写清楚对方凭的那个东西此刻真的有效——\
他真能签那个字、真能让人走人、真能把名字划掉。\
作废要当场完成，而且靠一个具体的动作或一件具体的东西完成，不是靠旁白说他厉害。\
强弱要用能比较的量写出来：数目、职级、年限、单价、辈分。\
基座要求每隔几轮插一段叙述——这里插的那一段要写**在场的人具体做了什么**：\
谁先停了手、谁往后退了半步、谁转身去打那个电话、谁把笔放下了。\
不要写「众人震惊」「全场哗然」这类集体名词，那是把该写的反应省掉了。"""

[meta]
# 20000/10 走通用骨架。单章约 1940 字，接近网文一章的体量，
# 而爽文的节奏单位就是「一章一个爽点」—— 章比别的档位更该短、更该多。
target_total_chars = 20000
chapters = 10
scenes_per_chapter = 3

[rhythm]
# **首末章刻意不用 short，这是和其余六个档位相反的一处。**
# metrics.py:187-191 给 short 档豁免了对话密度类硬线（DENSITY_KEYS），
# 依据是参照书的冷开场/收束章对话占比低到 1.6%、那是刻意的。
# 爽文反过来：第一章就必须有爽点（网文的「黄金三章」），末章是最大的那次打脸 ——
# 这两章恰恰是全篇对话最密的，豁免它们等于把闸门关在最该开的地方。
# 所以 open=normal、close=long。
#
# 顺带一个算出来的好处：plan_scenes 的 want = round(章目标/SCENE_CHARS=560)，
# normal 章 1942 字 → 3 场，正好对上章内三拍（压制成立 → 加码 → 当场作废）；
# 末章 2514 字 → 4 场，最大的那次打脸多一拍。
# 而单场 647 字落在 README echo 表的「600-799」桶（受影响章 8%），
# 不在 400-599 那个 tail/scene≈1.00 的危险区。
short = 1300
normal = 1700
long = 2200
open_scale = "normal"
close_scale = "long"

[scene]
driver_name = "爽点"
driver_desc = "这一场谁凭什么压了谁、哪个凭据被当场作废、在场的人看见的是哪个动作"
# ⚠ **不要给一个句式模板。** 第一版写的是「driver 必须写成『A 凭 X 压 B，
# B 的 Y 当场把 X 作废』」，并且要求 X 就是本章的 {obj}。
# 实测（2026-10-22，shuangwen-check-01 第一版）后果是章内 3 场的 driver
# **一字不差**，plans_lint 报爽点重合 1.00；跨章也到 0.64~0.97。
# 原因不是模型不听话，是**模板的每一个槽都被绑成了章级常量** ——
# X 是 must_object、Y 是反制物，两头都不随场次变，per-scene 没有任何可变的东西，
# 于是它填一次、复制 {want} 次。后面那句「不是同一次打脸拆成 {want} 段演示」
# 是负向指令，照例无效（见 nodes/plan.py 的模块注释）。
#
# 改法用项目里已经验证过的那个杠杆（正向局部约束，跨章论题重复 12 处 → 0 处）：
# 给每一场**自己的职责**，并且点明这一场的落点是**哪一类东西** ——
# 理由 / 人或代价 / 动作是三类不同的东西，写出来的句子没法相同。
driver_rule = """· 本章 {want} 场各有**不同的职责**。每一场的 driver **只写这一场的落点本身**，
  一句话、不超过 25 字 —— 写长了就会变成复述本章梗概，{want} 场就又都一样了。
  - 第 1 场的落点是**理由**：压制方拿出「{obj}」时，被压的人驳不倒它，
    靠的是哪一条理由。driver 就写那条理由。
  - 最后一场的落点是**动作**：被压的人做了哪一个动作，让「{obj}」失效。
    driver 就写那个动作。
  - 中间各场的落点是**这一场新压上来的那一项代价**：一笔要赔的数、
    一个要签的字、一个到期的日子、一样要交出去的东西。
    driver 就写那一项代价本身和它落在谁头上。
    （⚠ 第二版这里还列了「又一个人的表态」，实测 shuangwen-check-03 模型就死咬
    这一类不放：「沈青梧出示审核记录本，指出 X」连着 5 章，其中两章重合 1.00。
    人只有两三个、表态只有站哪边，这一类的取值空间本来就小 —— 而代价是从本章
    处境里长出来的，空间大得多。这一条改了之后**还没有单独验过**。）
· 压制方必须**真的有**「{obj}」这个凭据，他只是不知道被压的人手上有什么。
  凭据不实的压制，作废了也不爽 —— 这是本档位最该在这里拦住的东西。
· 每一场的 outcome 写在场的见证人看见的那个具体动作。
· 作废要靠动作完成，不靠「其实他早就是某某」这种身份揭露 —— 身份不是动作。
"""
axis_name = "压制与反转"
axis_desc = """压制与反转：谁在压制谁、他凭的那个东西是什么（必须是真实有效的）、
这个凭据最后被什么当场作废"""
stance_desc = "他凭什么压人或被压；他手上那个被低估的东西是什么；凭据作废之后他还剩什么"
premise_rule = """· logline 要写明三样：谁在压制、凭的那个东西是什么、主角手上被低估的是什么。
· 他凭的那个东西要能被指认 —— 一个职位、一笔数、一个名分、一道规矩。
  「他很有背景」「他实力深不可测」这类不可指认的压制不算立意。
· 主角手上那个东西必须**在第一章就已经存在并露过面**，不准在打脸那一刻才出现。
  （同 xuanyi 的线索公平性：早埋好才爽，凭空开挂不爽。）
· ending_direction 要写明最后一次作废靠的是什么，以及压制方失去的是哪一样。
· concrete_objects 必须是能被拿出来、翻开、念出声、或者被划掉的东西 ——
  凭据与作废凭据的物都在这一类里。不要写「实力」「人脉」「气运」这类抽象概念。
"""
# ⚠ 上面那条**刻意不举例子**。xiaoyuan.toml 的实测（2026-10-20，149 份立意）：
# premise_rule 举了 6 个物件例子，产出的前 6 名就是那 6 个，唯一物件只剩 30%，
# 而一个例子都没举的 xuanyi 是 67%。8B 不照办负向清单，但会把正向的例子
# 直接当答案抄走。要约束就只约束类别，具体性由 --genre 的种子行提供。
cast_rule = """· A 是被压制的人，B 是压制者。B 的凭据必须真实有效，而且他要有用它的理由，
  不能只是为了欺负人 —— 没有利害的压制，作废了没有重量。
· C 是**见证人**，这个档位里 C 不是可选的：爽点由在场者的反应承载。
  C 的 concrete 要写他为什么必须在场（他管这件事、他要在这上面签字、
  他正等着看结果），不是路人。
· 不要安排「向读者解释主角有多厉害」的角色。那个角色的存在本身就是旁白代劳。
· ORG 填定下这条规矩的机构，LOC 填作废发生的那个具体地方（柜台、堂上、会议室）。
"""
# 下面那张**类别**清单是故意给的，和 xiaoyuan 的教训不冲突：那条教训说的是
# 别给 concrete_objects 的**实例**（举了磁带/课表，产出前 6 名就是那 6 个）。
# 这里给的是凭据的**类别**，而且要求各章不重复、再由种子行的处境落成具体的东西 ——
# 「约束类别，别给实例」正是那条教训的结论。
# 不给这张清单的后果已经实测到了（shuangwen-check-01 第一版）：
# 十章里「三年前的供货单」占了 5 章，反制物 8 章都是「旧账本」。
outline_rule = """· 每章必须有一次当场作废。各章的 must_object 要落在**互不相同的凭据类别**上，
  一章一类，不准重复：签字权、一笔钱、一个职级、一个名分、一道规矩、
  一份资历、一本名册、一个期限、一道许可、一次表决。
  每章挑一类，写成这个处境里**具体的**那样东西。
· 作废它的东西每章也要换。不准十章都靠同一样东西翻盘。
· 压制必须在本章内先成立再被作废 —— beat 要写清先是怎么压住的。
  不准开章就打脸，读者没有被压的实感。
· 上一章作废掉的东西，要成为下一章压制加码的理由（对方换更硬的凭据来）。
· 不准有任何一章的任务是「交代背景」或「铺垫」。爽文没有过渡章。
"""
# 爽点的措辞天然接近 —— 「让「X」失效」就是这个档位的脊梁，同一个句式是本体，
# 不是毛病。阈值按实测定（2026-10-22，shuangwen-check-02 的 10 章 31 场）：
#   章内三场改成按职责分派之后，重合从 1.00 掉到报不出来
#   跨章仍有 0.63~0.77，其中 0.63~0.67 那一档是句式天然相近，不是塌缩
# 所以放到 0.68：留住结构性塌缩的检出（上一版那个 1.00 仍会被抓），
# 又不会在句式上刷屏 —— 一刀切的 0.55 会在这个档位上淹掉所有真信号，
# 同 xuanyi 把「线索」放到 0.60 的理由（见 plan.plans_lint 的注释）。
# observe 跑完 2~3 部之后回来复核这个数。
dedup_threshold = 0.68
min_speakers = 2            # 打脸要有被打的人 + 见证人，一个人打不了脸
require_object = true       # 凭据是本章推进的唯一落点，比别的档位更要紧

[gates]
min_ratio = 0.55
sim_threshold = 0.90
theme_max = 0.75            # 每章都是「压制→作废」，节与节的 bigram 重合是小说档位里最高的
title_sim_max = 0.60
plot_sim_max = 0.70         # 摘要天然是同一个句式，比 xiaoyuan 的 0.65 还要再放一档
# **tpl 刻意不放宽，这是本档位和直觉相反的一处。**
# 爽文的套路句式（「脸色一变」「倒吸一口凉气」）密度天然比别的题材高，
# 看起来该把 16/千字 放宽。但爽文的塌缩形态**恰恰就是**整章由套路句堆成 ——
# 放宽这一条等于把这个档位唯一能测到的塌缩信号关掉。
# 先按 16 跑 observe，看命中率再决定；真要改也该是改 blacklist，不是改密度线。
tpl_per_kilo = 16.0
tpl_single_max = 2
sent_dup_min_len = 10
sent_dup_max = 2
sent_self_dup_max = 0
degrade_after = 3

# 爽文是对峙体，对话占比在所有档位里最高。区间给宽：
# 加码场几乎全是对白，而作废那一场有大段动作与反应。
[targets.dialogue_chars_pct]
lo = 30.0
hi = 70.0
hard = 10.0

# 爽文不写主角的内心，但**写反派与见证人的反应**，而 INNER 正则会把
# 「心里一惊」「意识到」「明白」算成心理活动。所以区间要比言情之外的档位都宽。
# 硬线 45%：只拦「通篇是别人心里怎么想，没有一个动作落下来」。
[targets.interiority_para_pct]
lo = 0.0
hi = 30.0
hard = 45.0

# 动作与在场者的反应是爽点的另一半本体 —— 但 **lo 必须按 8B 实际做得到的来定**。
# 第一版写 lo = 15，照抄别的档位。实测（2026-10-22，shuangwen-check-03）全书只有
# **5.8**，于是每一章都会报一条软警告 —— 而 README「实测记录」里早就记了这条：
# narration_para_pct 两次真跑都是 0~4.9，「加了『每三到五轮插一段』后没有改善」，
# prompt 挪不动它。永远亮着的警告等于没有警告，还会把真的软信号淹掉。
# 所以放到 5.0：它现在检出的是「连 8B 的平均水平都没有、整章一个反应段都没有」,
# 和上面 dialogue_run_mean 那条双峰互为印证。
# 没有 hard —— 这一侧的硬线方向是「高于则拦」（metrics.structural_reasons:227-232），
# 对爽文正好是反的，设了只会拦对的章。
[targets.narration_para_pct]
lo = 5.0
hi = 55.0

# 「冷冷地说」「不屑道」在爽文里最密，而基座 system 禁的就是它。
# 比 xiaoyuan 的 22 再放一档到 25，承认题材压力，但不取消这条约束。
[targets.attr_adv_pct]
lo = 0.0
hi = 12.0
hard = 25.0

# hi = 14 的依据是实测出来的**双峰**，不是「放宽到贴合分布」。
# 实测（2026-10-22，shuangwen-check-03 的 9 章）：
#   6 章落在 3.8~8.2 —— 对峙有节拍，中间有反应段
#   3 章冲到 25 / 31 / 44 —— 整章纯对白乒乓，一个反应段都没插进去
# 44 段连续对白就是 README「实测记录」里那条「96.8% 对话段」的塌缩形态，
# prose_system_extra 要求的「插一段写在场的人做了什么」在这三章完全没落地。
# 所以 14 这条线的作用是**把这两群分开**，正好落在空档里 —— 既不冤枉前 6 章，
# 又让后 3 章扣分（上侧没硬线，_band_score 封在 60，不会硬拦、只压综合分）。
# 这是这个档位第一批 observe 数据里信号最清楚的一项，别往上调。
[targets.dialogue_run_mean]
lo = 2.0
hi = 14.0
hard = 1.0
