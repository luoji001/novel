# AI 发展推演 / 非虚构预测文章
#
# 这是**第一个非虚构档位**。它和六个小说档位的区别不在题材语言，而在文体：
# 整条链路原本写死「小说」（结构编辑的身份、正文 system、标题/摘要/书名/审校），
# 这里靠 [diction] 把那几个词换掉、靠 prose_system **整段替换**正文 system。
# 为什么不能只用 prose_system_extra 追加：基座那段的每一句都预设对白
#（弯引号、对话归属、每三到五轮插一段叙述），追加压不掉反向指令，而 8B 面对
# 自相矛盾的 system prompt 产出最不稳 —— 它会同时试着写文章和写对白。
# 机制见 config.Diction 与 config.Profile.prose_system 的注释。
#
# ⚠ [targets] 的数字是**未经标定的起点**，不是实测值 —— 而且这个档位比别的更不可信：
# 现有密度指标（对话占比 / 心理活动 / 对话 run）全部是为对话体小说定义的，
# 在文章上量不到真正的塌缩（空话、没有可核查的量、循环论证、同一步推论反复演示）。
# 所以这里**一条密度硬线都不设**，只留章长与复读两类硬拦。
# 先 `--gate observe` 跑 2~3 部，从 logs/quality.jsonl 看分布再回来改。
# 真要标定这个档位，得先往 profiles-sft/aiyuce/ 放一批中文推演文章当尺子
#（`novel-agent baseline aiyuce`），对话类指标在那批语料上大概也是 0 附近。
#
# ⚠ 产出是**推演**，不是事实分析。本地 8B 不具备可核查的事实能力，它写出的数字、
# 公司、论文一律按虚构处理。这个档位的价值在推理链的形状（每一步钉在一个量上、
# 每一步都写明被什么推翻），不在结论的准确性。
name = "AI 推演"
prose_model_hint = "每一步推论钉在一个可核查的量上，不要用形容词推进论证"

# 整段替换 PROSE_SYSTEM_BASE。保留了基座里唯一跨文体成立的那条
#（「不要大段写心里怎么想」），其余按文章重写。
prose_system = """\
你是中文非虚构作者，写技术推演文章。只输出文章正文，不要标题、不要编号、不要小标题。
每一段推进一步推论，并且钉在一个可核查的量上：价格、功耗、交付周期、人头数、合同条款。
禁止用形容词推进论证——「极其强大」「前景广阔」「势不可挡」这类词出现就算这一段白写。
写法是：先给现在就能观察到的事实，再推一步，再写明这一步成立的条件。
可以写具体的人在具体一天做的具体事，但他们是用来让机制落地的例子，不是人物——
不要写内心活动、不要编对话、不要写成小说场景。
每隔几段要出现一次「这条推论会被什么推翻」，用一句能被观察到的反证写明。
不要在段末下判断，不要写展望段，不要用「总之」「可以预见」收尾。"""

# 交付形态：去掉章号、保留小标题。
# 文章有小标题（读者靠它扫论证链），但没有「第N章」。
# 内部仍按章生成 —— 闸门机器依赖章标题做跨章去重与撞车检查。
[form]
kind = "sectioned"
unit_label = "节"

# 文体称呼。默认值是小说口径，这里逐项换成文章口径。
[diction]
work = "推演文章"
piece = "文章"
unit = "节"
section = "小节"
editor = "中文非虚构稿件的结构编辑"
critic = "中文非虚构稿件的责任编辑"
cast_noun = "当事方"
speaker_label = "必须出场的当事方"

[meta]
# 9000 字 / 6 节 ≈ 中文长篇推演文章的常见体量。这个数**没有语料依据**，
# 是按「一条推论链能讲完、又不至于注水」估的，等 observe 跑完再调。
target_total_chars = 9000
chapters = 6
scenes_per_chapter = 3


[rhythm]
short = 1000
normal = 1500
long = 2000
open_scale = "normal"       # 第一节要把当下的量摆齐，太短摆不下
close_scale = "short"       # 末节只写「什么会推翻它」，不需要长

[scene]
driver_name = "推论"
driver_desc = "这一小节往前推的那一步：从哪个可观察到的量推出什么，以及这一步成立的条件"
driver_rule = """· 每一场的 driver 必须写成「因为 X，所以 Y，除非 Z」。
  X 是现在就能观察到的数（价格、功耗、交付周期、人头、条款），不是趋势判断；
  Z 是会让这一步失效的条件 —— 没有 Z 的推论不准写进来。
· {want} 场要推 {want} 步**不同的**推论，后一步的前提是前一步的结论，
  不是同一步换个说法再演示一遍。
· 必须围绕「{obj}」展开 —— 这个量是本节推理的落点，每一步都要回到它。
· 不准出现「专家认为」「业界普遍预计」这类没有出处的权威句。
"""
axis_name = "核心判断"
axis_desc = "核心判断：本篇预测什么会发生，以及最强的反方理由是什么（两边都要站得住）"
stance_desc = "他手上的那个量指向哪一边，这件事成了他得利还是受损"
premise_rule = """· logline 写成一句**可被证伪**的预测：「到 X 年，Y 会 Z」。
  「AI 将深刻改变世界」这类不可证伪的句子不算立意。
· setting 写当下的起点：年份、地点、以及现在就能观察到的那几个数。
· concrete_objects 必须全部是**可核查的量或制品**：一张电费单、一份招聘 JD、
  一条推理报价单、一台机器的折旧表。不要写「算力」「生态」这类抽象概念。
· ending_direction 要写明：如果这个预测错了，最可能错在哪一步。
"""
cast_rule = """· 当事方按「手上有哪个量」设计，不按性格设计。
  A 是被这个趋势挤压的那一方，B 是推动它或靠它获利的那一方。
· name 用具体的人或机构，岗位加地域就够（「东莞一家模组厂的排产员」）。
  他们的作用是让机制落地，不是演故事 —— 不要给他们编言行。
· 不要安排「向读者解释技术原理」的角色，那个角色的存在本身就是败笔。
· ORG 填机构，LOC 填这个机制最先显形的地方。
"""
outline_rule = """· 每节推进一步，后一节的起点必须是前一节的结论。
· 第一节只负责把当下的量摆出来，不准在第一节就跳到结论。
· 最后一节写「这条预测会被什么推翻」，不是写展望。
· 全篇不准有任何一节的任务是「总结前文」或「交代背景」。
"""
# 推论都是「因为…所以…」的句式，措辞天然接近 —— 阈值放宽，否则 lint 会刷屏。
# 同 xuanyi 把「线索」的阈值放到 0.60 的理由（见 plan.plans_lint 的注释）。
dedup_threshold = 0.62
min_speakers = 0            # 文章没有「必须开口的人」
require_object = true       # 可核查的量是推理唯一的落点，比小说里更要紧

[gates]
min_ratio = 0.55
sim_threshold = 0.90
theme_max = 0.82            # 全篇围着一条预测推，节与节的 bigram 重合是所有档位里最高的
title_sim_max = 0.60
plot_sim_max = 0.72
tpl_per_kilo = 16.0
tpl_single_max = 2
sent_dup_min_len = 10
sent_dup_max = 2
sent_self_dup_max = 0
degrade_after = 3

# ⚠ 下面三段**必须存在，而且 lo 必须是 0** —— 这不是审美选择，是绕开一个已知的坑。
# checks.score_text:296-312 的逻辑是「profile 给了区间就按区间打分，没给就退回
# 论辩体的老锚点」。文章的 dialogue_chars_pct 本来就是 0 附近，走老锚点会算出
# dialogue_score = 25，而它在短板门限（_SHORTFALL_DIMS）里 ——
# 于是每一节的综合分都会被钉在 25 分：闸门正确放行、打分器判不及格。
# 这正是 checks.py:184-189 记录过的那个坑换了个维度。而 quality.jsonl 的分数是
# 筛 SFT 数据的依据，虚低分会把写得最对的节全筛掉。
#
# 三段都**不设 hard**：这几个指标在文章上量不到塌缩，设任何硬线都只会拦对的。
[targets.dialogue_chars_pct]
lo = 0.0
hi = 18.0                   # 引述别人的话超过两成，就不是推演文章了

[targets.interiority_para_pct]
lo = 0.0
hi = 40.0                   # INNER 正则把「似乎」「意识到」「明白」算成心理活动，议论天然高

[targets.dialogue_run_mean]
lo = 0.0
hi = 4.0

# 文章的本体。低于 45% 说明被写成了场景与对白 —— 这是这个档位最该报警的一条，
# 但只能是软警告：narration 这一侧的硬线方向是「高于则拦」
#（见 metrics.structural_reasons:227-232），对文章正好是反的。
[targets.narration_para_pct]
lo = 45.0
hi = 100.0
