# 校园青春爱情
#
# ⚠ 下面 [targets] 的数字是**未经标定的起点**，不是实测值。
# bianlun.toml 的数字来自《天幕红尘》51 章的单章分布（p3 定硬线），这个档位没有
# 对应的参照语料。所以硬线全部放得很松，只抓真塌缩。
# 正确做法是 `--gate observe` 跑 2~3 部，从 logs/quality.jsonl 取各指标的单章 p3，
# 再回来改这里。详见 README「闸门模式：第一次必须用 observe」。
# 想标定的话：往 profiles-sft/xiaoyuan/ 丢语料，跑 `novel-agent baseline xiaoyuan`。
#
# ── 和 yanqing（言情关系）的区别，这是本档位存在的理由 ──
# 不是父子关系，**张力来源不同**：
#   yanqing  张力 = 两人各自站得住的需求不兼容（要留在这座城市 vs 要那份工作）
#   xiaoyuan 张力 = 有限的时间 + 改不了的外部安排（高考、文理分科、毕业去向）
# 言情档位的 premise_rule 明确禁止「外部阻碍」，因为成人关系里那通常是廉价的；
# 但校园恋爱**恰恰**被外部安排支配，而且那些安排是真实、不可协商、与两人无关的。
# 三个派生差别：
#   ① 十几岁的人说不出口 → 心理活动占比天然更高（硬线放到 50%）
#   ② 对话短、碎、带回避 → 对话占比与 run 都比言情低
#   ③ 学生几乎没有可支配资源 → 「手上有什么」要重新定义成小物件
name = "校园青春"
prose_model_hint = "说不出口的话是本体；外部安排推着两人，谁也改不了"
prose_system_extra = """\
这是校园青春小说。人物是十几岁的学生，**他们说不清自己的感受**——\
不要让他们把心事讲明白，让它留在动作、沉默、写了没发出去的话里。\
对话要短、要有回避、要岔开话题；成年人那种把需求摊开讲的对白不符合这个年纪。\
外部安排（考试、分科、调座位、放假、毕业）由不得他们决定，\
不要让人物靠努力或沟通就把它改掉。\
写具体的校园物：课表、值日表、笔记本的夹页、走廊的公告、操场的广播。"""

[meta]
# 18000/9 而不是言情的 20000/10：校园青春的时间跨度通常更紧
# （一个学期、一次考试前后），拖长了就变成成长小说而不是这个题材。
target_total_chars = 18000
chapters = 9
scenes_per_chapter = 3

[rhythm]
# 比言情更紧。首末章走 short：开学的冷开场和毕业的收束，
# 这两处对话天然少，short 档会豁免密度类硬线（见 metrics.py:187-191）。
short = 1300
normal = 2000
long = 2800
open_scale = "short"
close_scale = "short"

[scene]
driver_name = "距离"
driver_desc = "这一场两人的距离挪了哪一点（谁靠近、谁退开），以及是哪件外部安排推的"
driver_rule = """· 每一场的 driver 必须写成「因为 X（外部安排），两人的距离从 A 变成 B」。
  外部安排必须是具体的、学生改不了的：调座位、分科、月考排名、家长会、
  社团解散、保送名单、搬家。不准是「误会」或「有人挑拨」——那是可以靠说话解决的，
  不构成这个题材的张力。
· {want} 场要走 {want} 个**不同的**台阶，围绕「{obj}」展开。
· 距离的变化必须是**不可逆的一小步**。「吵了一架然后和好」不算——那是回到原点。
· 不准让人物把心事说明白来推进剧情。推进要靠做了什么、没做什么、
  以及那件外部安排本身的进展。
"""
axis_name = "时限张力"
axis_desc = """两人想靠近，但有一个不由他们决定的期限或安排在推着他们分开。
写明：期限是什么（什么时候到）、安排由谁定的、为什么他们改不了"""
stance_desc = "他想靠近还是想躲；他说不出口的那件事是什么；他手上有什么小权力（值日、广播、收作业）"
premise_rule = """· 核心张力必须是**时限 + 无力改变的外部安排**，不是误会、不是第三者。
  误会说开就没了；而分科表贴出来那天，谁也改不了。
· ending_direction 不必写「在一起/没在一起」，要写**各自去了哪里**，
  以及那件说不出口的事最后有没有被说出来。
· concrete_objects 必须是学生真能拿在手上、或者每天都会经过的小东西，
  而且必须从上面那条**题材里的具体处境**长出来 —— 那条处境已经指定了年代、
  学校类型和那件外部安排，物件要是那个处境里才会有的东西，
  不要换成一个放在任何校园故事里都成立的通用物。
"""
# ⚠ 这一条**刻意不举例子**。原文举了 6 个（笔记本／课表／校服外套／磁带／
# 公告栏的名单／操场看台的某个位置），实测 2026-10-20 那批 149 份立意：
#   磁带×81、公告栏的名单×80、校服外套×79、课表×74、操场看台的某个位置×51
# —— 举的 6 个例子就是产出的前 6 名，唯一物件 224/745 槽位 = 30%。
# 对照 xuanyi.toml 的 premise_rule 一个例子都没举 → 893/1333 = 67%。
# 下游后果：149 本书里 40 本的书名含「磁带」，唯一书名只剩 84 个 ——
# 标题生成器被要求「用具体物件命名」，而物件空间已经塌成两三个词了。
# 结论与 nodes/plan.py 记录的那条互补：8B 不照办**负向**清单，
# 但会把**正向**的例子直接当答案抄走。要约束就约束类别，别给实例。
cast_rule = """· A 和 B 是同龄学生。两人都要有「说不出口的那件事」，而且两件事不一样。
· 每人的 concrete 要写他手上那点小权力——收作业、管广播、排值日、
  有自行车、住校还是走读。这个年纪的人物分量来自这些，不来自钱或职位。
· 可以有 C（老师/家长/转学生），但 C 的作用是**执行外部安排**，
  不是制造误会，也不是当第三者。
"""
outline_rule = """· 每章必须让「外部安排」推进一格，而且那一格不是人物争来的。
· 时间线要有明确的校园节点（开学、月考、运动会、分科、寒暑假、毕业），
  读者要能感到倒计时。
· 不要安排任何一章是纯粹的「甜」——每章都要有代价或遗憾。
"""
dedup_threshold = 0.55
min_speakers = 1            # 允许单人视角的场（隔着教室看、一个人留在教室）
require_object = true

[gates]
min_ratio = 0.55
sim_threshold = 0.90
theme_max = 0.72            # 全篇就两个人的关系，主题重合必然很高（同 yanqing）
title_sim_max = 0.60
plot_sim_max = 0.65
tpl_per_kilo = 16.0
tpl_single_max = 2
sent_dup_min_len = 10
sent_dup_max = 2
sent_self_dup_max = 0
degrade_after = 3

# 对话比言情低：这个年纪的人不会把话说透，而且有大量「没说出口」的篇幅
[targets.dialogue_chars_pct]
lo = 20.0
hi = 55.0
hard = 8.0

# 心理活动是本体，而且比言情更高 —— 说不出口的部分只能写在心里。
# 硬线 50%（和纯文学同档）：只拦「通篇只有想法、没有任何外部世界」。
[targets.interiority_para_pct]
lo = 8.0
hi = 35.0
hard = 50.0

# 校园的物理环境（教室、走廊、操场、公告栏）是重要载体
[targets.narration_para_pct]
lo = 15.0
hi = 60.0

[targets.attr_adv_pct]
lo = 0.0
hi = 12.0
hard = 22.0

# 对话短碎、常被岔开，run 比言情低
[targets.dialogue_run_mean]
lo = 1.5
hi = 10.0
hard = 1.0
